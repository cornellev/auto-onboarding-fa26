name: Rust and transport
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        run: |
          cargo run --locked --example generate_schema
          cargo fmt
          git diff --exit-code -- src/generated proto config/protobuf-profile.json
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
  transport:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - id: refs
        run: python -c 'import json,os; v=json.load(open("config/services.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); print("sim="+v["sim_ref"],"orch="+v["orchestrator_ref"],sep="\n",file=f)'
      - uses: actions/checkout@v4
        with:
          repository: cornellev/orchestrator
          ref: ${{ steps.refs.outputs.orch }}
          path: services/orchestrator
      - uses: actions/checkout@v4
        with:
          repository: cornellev/ev-sim
          ref: ${{ steps.refs.outputs.sim }}
          path: services/sim
      - run: python -m pip install -r services/orchestrator/requirements.txt -r services/orchestrator/requirements-protobuf.txt
      - run: python services/orchestrator/scripts/install_zenoh.py --directory .tools
      - run: python scripts/check-stack.py --orchestrator services/orchestrator --sim services/sim --router .tools/zenohd${{ runner.os == 'Windows' && '.exe' || '' }}
