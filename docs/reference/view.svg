  <text x="530" y="700" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#555">Later runs add a blue path and an orange driven trace. This one has neither.</text>
  <text x="48" y="740" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#222">Your view.svg should show the two black cells and the green goal. This command draws no path and no driven trace, so the blue and orange lines are absent.</text>
  <text x="48" y="764" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#222">The rings, the axle arrow, and the zoom are not in the program's picture. They only make the cells easy to find.</text>
  <text x="48" y="788" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#222">Cell (46, 41) contains (1.00, 1.10). Cell (56, 51) contains (2.00, 2.10). The first scan point is stored twice, and both copies fall in (46, 41).</text>
  <text x="48" y="812" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#222">Use Grid::cell for the column and row. The hit is the bottom-left corner of the square, not the middle. Middles are (1.05, 1.15) and (2.05, 2.15).</text>
</svg>
