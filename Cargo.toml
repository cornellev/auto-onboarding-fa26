[package]
name = "cev-onboarding"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simcontrol = { git = "https://github.com/cornellev/ev-sim", rev = "6c095b97ff1b5eed90777ccd15a53726b2ce86e2" }
ctrlc = "3"
ureq = { version = "3.5", features = ["json"] }
base64 = "0.22"
prost = "=0.14.4"
sha2 = "0.10"
# Newer uuid releases require Rust 1.89; keep the starter compatible with 1.88.
uuid = { version = "=1.26.1", features = ["v4"] }
zenoh = { version = "=1.10.2", default-features = false, features = ["transport_tcp"] }

[dev-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "3"

